spring:
  application:
    name: imsa-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/imsa}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgrespassword}
    driver-class-name: org.postgresql.Driver
  jackson:
    time-zone: Asia/Taipei
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: Asia/Taipei

server:
  port: 8080

vonage:
  api-key: ${VONAGE_API_KEY:}
  api-secret: ${VONAGE_API_SECRET:}
  from: ${VONAGE_FROM:Vonage APIs}
  dry-run: ${VONAGE_DRY_RUN:true}



