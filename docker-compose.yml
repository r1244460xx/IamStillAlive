version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: imsa-postgres
    environment:
      POSTGRES_DB: imsa
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4
    container_name: imsa-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@imsa.com
      PGADMIN_DEFAULT_PASSWORD: adminpassword
    ports:
      - "5050:80"
    depends_on:
      - postgres
    restart: unless-stopped

volumes:
  postgres_data:
